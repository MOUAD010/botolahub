services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: kooralive:latest
    container_name: kooralive
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  # Hot-reload development (optional)
  # Usage: docker compose --profile dev up web-dev
  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    container_name: kooralive-dev
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - kooralive_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  kooralive_node_modules:
